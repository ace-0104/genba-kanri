<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>指摘シート</title>
<style>
:root{--main:#1f4e79;--main-l:#e8eef5;--line:#333;--bg:#eef1f5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;background:var(--bg);color:#222;padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* ===== 上部：ページ切替 ===== */
.topbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #d5dbe3;padding:10px 12px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;min-width:56px;height:42px;padding:0 14px;border-radius:21px;border:1px solid #c5ced9;background:#fff;font-size:15px;font-weight:bold;color:#555}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.tab.add{border-style:dashed;color:var(--main);border-color:var(--main)}

/* ===== 入力カード ===== */
.wrap{max-width:560px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.card-h b{font-size:16px;color:var(--main)}
.del{border:none;background:none;color:#c0392b;font-size:14px;padding:6px}
label.t{display:block;font-size:13px;font-weight:bold;color:#555;margin:14px 0 6px}
label.t:first-child{margin-top:0}
input[type=text],input[type=date],textarea{width:100%;padding:12px;font-size:16px;border:1px solid #c5ced9;border-radius:10px;background:#fafbfc;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--main);background:#fff}
textarea{min-height:96px;resize:vertical}
.row2{display:flex;gap:10px}.row2>div{flex:1;min-width:0}

/* 写真 */
.file{display:none}
.photo-area{border-radius:12px;overflow:hidden;background:#f3f5f8;border:2px dashed #b9c4d1}
.photo-area img{display:block;width:100%;max-height:260px;object-fit:contain;background:#222}
.photo-area .ph-empty{padding:26px 0;text-align:center;color:#8a96a3;font-size:14px}
.photo-btns{display:flex;gap:8px;padding:8px;background:#f3f5f8}
.photo-btns label{flex:1;padding:12px 4px;text-align:center;font-size:15px;font-weight:bold;border-radius:10px;background:#fff;border:1px solid var(--main);color:var(--main)}

/* 区分 */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{padding:12px 4px;border:1px solid #c5ced9;border-radius:10px;background:#fff;font-size:15px;text-align:center;user-select:none;color:#444}
.chip.on{background:var(--main);border-color:var(--main);color:#fff;font-weight:bold}
#other{margin-top:8px}

/* プレビュー */
.pv-h{font-size:13px;font-weight:bold;color:#555;margin:4px 2px 8px}
.pv{position:relative;overflow:hidden;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.18);background:#fff}
.pv .sheet{position:absolute;top:0;left:0;transform-origin:top left}

/* ===== 下部ボタン ===== */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid #d5dbe3;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px}
.bottombar button{flex:1;height:52px;border-radius:12px;font-size:16px;font-weight:bold;border:none}
.b-add{background:#fff;color:var(--main);border:2px solid var(--main)!important}
.b-print{background:var(--main);color:#fff}

/* ===== A4シート ===== */
.sheet{width:180mm;height:250mm;background:#fff;padding:5mm;display:flex;flex-direction:column;overflow:hidden;color:#222;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
.sheet table.info{width:100%;border-collapse:collapse;font-size:11pt;flex-shrink:0}
.sheet table.info th,.sheet table.info td{border:1px solid var(--line);padding:2.5mm 3mm;text-align:left}
.sheet table.info th{background:var(--main-l);width:22mm;white-space:nowrap}
.s-photo{flex:1;min-height:0;position:relative;margin-top:4mm;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fafafa}
.s-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.s-photo .empty{color:#aaa;font-size:12pt}
.s-cat{flex-shrink:0;margin-top:4mm;font-size:11pt;display:flex;flex-wrap:wrap;gap:2mm 6mm;border:1px solid var(--line);padding:2.5mm 3mm}
.s-box{flex-shrink:0;margin-top:4mm;border:1px solid var(--line)}
.s-box .h{background:var(--main-l);padding:1.5mm 3mm;font-weight:bold;font-size:10.5pt;border-bottom:1px solid var(--line)}
.s-box .b{padding:3mm;height:32mm;overflow:hidden;font-size:11pt;white-space:pre-wrap;line-height:1.6}
.s-foot{flex-shrink:0;margin-top:4mm;display:flex;justify-content:space-between;align-items:flex-end}
.s-no{font-size:10pt;color:#555}
.s-stamp{border-collapse:collapse;font-size:9pt}
.s-stamp td{border:1px solid var(--line);width:45mm;text-align:center}
.s-stamp tr:first-child td{background:var(--main-l);padding:1mm}
.s-stamp tr:last-child td{height:18mm}

#printArea{display:none}
@page{size:A4 portrait;margin:8mm}
@media print{
  body{background:#fff;padding:0}
  .topbar,.wrap,.bottombar{display:none!important}
  #printArea{display:block}
  #printArea .sheet{break-after:page;page-break-after:always;break-inside:avoid;page-break-inside:avoid;margin:0 auto}
  #printArea .sheet:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="topbar"><div class="tabs" id="tabs"></div></div>

<div class="wrap">
  <div class="card">
    <div class="card-h"><b id="pageLabel">1枚目</b><button class="del" id="delBtn">🗑 この枚を削除</button></div>
    <div class="photo-area">
      <div id="photoView"><div class="ph-empty">写真がありません</div></div>
      <div class="photo-btns">
        <label for="fileCam">📷 撮影</label>
        <label for="fileAlbum">🖼 アルバム</label>
      </div>
    </div>
    <input type="file" id="fileCam" class="file" accept="image/*" capture="environment">
    <input type="file" id="fileAlbum" class="file" accept="image/*">
  </div>

  <div class="card">
    <div class="row2">
      <div><label class="t">日付</label><input type="date" id="date"></div>
      <div><label class="t">記入者</label><input type="text" id="person" placeholder="大澤"></div>
    </div>
    <label class="t">現場名</label>
    <input type="text" id="site" placeholder="〇〇ビル新築工事">
    <label class="t">場所</label>
    <input type="text" id="place" placeholder="3F X2-Y3 梁">
  </div>

  <div class="card">
    <label class="t">区分（複数OK）</label>
    <div class="chips" id="chips"></div>
    <input type="text" id="other" placeholder="その他の内容" style="display:none">
    <label class="t">内容</label>
    <textarea id="detail" placeholder="配管干渉のため施工不可。設備業者の移設待ち。"></textarea>
  </div>

  <div class="pv-h">▼ この枚のプレビュー</div>
  <div class="pv" id="pv"></div>
</div>

<div class="bottombar">
  <button class="b-add" id="addBtn">＋ 1枚追加</button>
  <button class="b-print" id="printBtn">🖨 PDF保存</button>
</div>

<div id="printArea"></div>

<script>
const $ = id => document.getElementById(id);
const CATS = ["ダメ残り","ダメ工事","補修","剥がし","削り","その他"];
const MM = 96 / 25.4, SW = 180 * MM, SH = 250 * MM;
const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fmt = v => { if(!v) return ""; const [y,m,d]=v.split("-"); const w="日月火水木金土"[new Date(v).getDay()]; return `${y}年${+m}月${+d}日（${w}）`; };
const esc = s => (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const blank = base => ({photo:"", date: base?.date || today(), person: base?.person || "", site: base?.site || "", place:"", cats:[], other:"", detail:""});

let pages = [blank()];
let cur = 0;

// 区分ボタン生成
$("chips").innerHTML = CATS.map(c => `<div class="chip" data-c="${c}">${c}</div>`).join("");
$("chips").onclick = e => {
  const c = e.target.dataset.c; if(!c) return;
  const p = pages[cur];
  p.cats = p.cats.includes(c) ? p.cats.filter(x => x !== c) : [...p.cats, c];
  loadForm(); renderPreview();
};

// 1枚分のシートHTML
function sheetHTML(p, i){
  const cat = CATS.map(c => {
    const on = p.cats.includes(c);
    const label = (c === "その他" && on && p.other.trim()) ? `その他（${esc(p.other.trim())}）` : c;
    return `<span>${on ? "☑" : "☐"} ${label}</span>`;
  }).join("");
  return `<div class="sheet">
    <table class="info">
      <tr><th>日付</th><td>${fmt(p.date)}</td><th>記入者</th><td>${esc(p.person)}</td></tr>
      <tr><th>現場名</th><td colspan="3">${esc(p.site)}</td></tr>
      <tr><th>場所</th><td colspan="3">${esc(p.place)}</td></tr>
    </table>
    <div class="s-photo">${p.photo ? `<img src="${p.photo}">` : '<span class="empty">写真なし</span>'}</div>
    <div class="s-cat"><b>区分</b>${cat}</div>
    <div class="s-box"><div class="h">内容</div><div class="b">${esc(p.detail)}</div></div>
    <div class="s-foot">
      <div class="s-no">No. ${i+1} / ${pages.length}</div>
      <table class="s-stamp"><tr><td>担当</td></tr><tr><td></td></tr></table>
    </div>
  </div>`;
}

// ページタブ
function renderTabs(){
  $("tabs").innerHTML = pages.map((_, i) => `<button class="tab ${i===cur?"on":""}" data-i="${i}">${i+1}枚目</button>`).join("")
    + `<button class="tab add" data-add="1">＋</button>`;
  $("tabs").querySelector(".tab.on")?.scrollIntoView({inline:"center", block:"nearest"});
}
$("tabs").onclick = e => {
  const b = e.target.closest(".tab"); if(!b) return;
  if(b.dataset.add) return addPage();
  cur = +b.dataset.i; refresh();
};

// フォームに現在ページを反映
function loadForm(){
  const p = pages[cur];
  $("pageLabel").textContent = `${cur+1}枚目 / 全${pages.length}枚`;
  ["date","person","site","place","other","detail"].forEach(k => { if($(k).value !== p[k]) $(k).value = p[k]; });
  document.querySelectorAll(".chip").forEach(el => el.classList.toggle("on", p.cats.includes(el.dataset.c)));
  $("other").style.display = p.cats.includes("その他") ? "block" : "none";
  $("photoView").innerHTML = p.photo ? `<img src="${p.photo}">` : '<div class="ph-empty">写真がありません</div>';
}

// プレビュー（画面幅に合わせて縮小）
function renderPreview(){
  const pv = $("pv");
  pv.innerHTML = sheetHTML(pages[cur], cur);
  const s = pv.clientWidth / SW;
  pv.style.height = (SH * s) + "px";
  pv.firstElementChild.style.transform = `scale(${s})`;
  // 印刷用も常に最新にしておく（押した瞬間にすぐ印刷できるように）
  $("printArea").innerHTML = pages.map(sheetHTML).join("");
}

function refresh(){ renderTabs(); loadForm(); renderPreview(); window.scrollTo({top:0, behavior:"smooth"}); }

// 入力
["date","person","site","place","other","detail"].forEach(k => $(k).addEventListener("input", () => { pages[cur][k] = $(k).value; renderPreview(); }));

// 写真
const onPhoto = e => {
  const f = e.target.files[0]; if(!f) return;
  const idx = cur;
  const r = new FileReader();
  r.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const max = 1600, s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = img.width * s; cv.height = img.height * s;
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      pages[idx].photo = cv.toDataURL("image/jpeg", .85);
      if(idx === cur){ loadForm(); renderPreview(); }
    };
    img.src = ev.target.result;
  };
  r.readAsDataURL(f);
  e.target.value = "";
};
$("fileCam").onchange = onPhoto;
$("fileAlbum").onchange = onPhoto;

// 追加（日付・現場名・記入者は前の枚から引き継ぎ）
function addPage(){
  pages.push(blank(pages[cur]));
  cur = pages.length - 1;
  refresh();
}
$("addBtn").onclick = addPage;

// 削除
$("delBtn").onclick = () => {
  if(!confirm(`${cur+1}枚目を削除しますか？`)) return;
  pages.splice(cur, 1);
  if(!pages.length) pages = [blank()];
  cur = Math.min(cur, pages.length - 1);
  refresh();
};

// PDF保存（全ページ）
$("printBtn").onclick = () => {
  // 空欄チェックはしない：未入力のままでもそのまま出力
  const old = document.title;
  const p0 = pages[0];
  document.title = `指摘シート_${p0.date || "日付なし"}_${p0.site || "現場"}_${pages.length}枚`;
  window.print();
  setTimeout(() => document.title = old, 1000);
};

window.addEventListener("resize", renderPreview);
window.addEventListener("beforeunload", e => {
  if(pages.some(p => p.photo || p.detail)){ e.preventDefault(); e.returnValue = ""; }
});

refresh();
</script>
</body>
</html>
